<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aon Assessment</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Fullscreen Start Screen Overalay -->
    <div id="start-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;display:flex;justify-content:center;align-items:center;flex-direction:column;">
        <h2 style="margin-bottom:20px;color:#d32f2f;font-size:32px;">AON Assessment</h2>
        <p style="margin-bottom: 30px; color: #555;">Please start the assessment. This will open in full-screen mode.</p>
        <button onclick="startExamFullscreen()" style="padding:15px 30px;font-size:18px;background:#283593;color:white;border:none;border-radius:5px;cursor:pointer;">Start Exam</button>
    </div>

    <header class="header">
        <div class="logo-container">
            <h1 class="logo">AON</h1>
        </div>
        <div class="user-info">
            <div class="candidate-details">
                <span class="candidate-name">Nirmal Kumar</span>
                <span class="candidate-id">Candidate ID: 52954961</span>
            </div>
            <div class="user-avatar">NK</div>
            <div class="timer">
                <div class="time" id="timer-display">15 : 50</div>
                <div class="time-labels"><span>Min</span><span>Sec</span></div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="instructions-link">
                <i class="fas fa-info-circle"></i> Instructions
            </div>
            <div class="sections-header">Sections</div>
            <div class="section-item active" id="tab-technical" onclick="switchSection('technical')">
                <div class="section-title">01. Technical</div>
                <div class="section-stats" id="stats-text">40 / 00 attempted</div>
            </div>
            <div class="section-item" id="tab-subjective" onclick="switchSection('subjective')" style="display: none;">
                <div class="section-title">02. Subjective</div>
                <div class="section-stats" id="subjective-stats-text">01 / 00 attempted</div>
            </div>
            
            <div class="sidebar-bottom">
                 <button class="submit-btn" id="global-submit" onclick="submitExam()" disabled>Submit</button> 
            </div>
            
        </aside>

        <main class="content-area">


            <div id="question-container" class="question-container">
                <!-- Questions injected by JS -->
            </div>

            <!-- Floating Right Toolbar -->
            <div class="right-toolbar">
                <button class="toolbar-btn"><i class="fas fa-times"></i></button>
                <button class="toolbar-btn"><i class="fas fa-redo"></i></button>
                <button class="toolbar-btn"><i class="fas fa-search-plus"></i></button>
                <button class="toolbar-btn"><i class="fas fa-search-minus"></i></button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
